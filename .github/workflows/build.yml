name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup SourcePawn
        uses: rumblefrog/setup-sp@master
        with:
          version: '1.12'

      - name: Get shavit includes
        run: git clone --depth 1 https://github.com/shavitush/bhoptimer.git bhoptimer

      - name: Compile
        run: |
          mkdir -p build
          spcomp addons/sourcemod/scripting/shavit-camangle.sp \
            -i bhoptimer/addons/sourcemod/scripting/include \
            -o build/shavit-camangle.smx -v2 -E

      - uses: actions/upload-artifact@v4
        with:
          name: shavit-camangle
          path: build/shavit-camangle.smx
